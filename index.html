<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="header__title">2048</h1>
      <div class="scores">
        <div class="score">
          <span class="score__label">Счёт</span>
          <span class="score__value" id="score">0</span>
        </div>
        <div class="score">
          <span class="score__label">Лучший</span>
          <span class="score__value" id="best">0</span>
        </div>
      </div>
    </header>
 
    <div class="toolbar">
      <button class="btn" id="undo-btn" type="button">↶ Отменить ход</button>
      <button class="btn" id="restart-btn" type="button">↻ Начать заново</button>
      <button class="btn" id="leaders-btn" type="button">🏆 Лидеры</button>
    </div>
 
    <section class="board-wrap">
      <div class="board" id="board"></div>
    </section>
  </main>
</body>
</html>

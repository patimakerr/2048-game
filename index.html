<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="header__title">2048</h1>
      <div class="scores">
        <div class="score">
          <span class="score__label">Счёт</span>
          <span class="score__value" id="score">0</span>
        </div>
        <div class="score">
          <span class="score__label">Лучший</span>
          <span class="score__value" id="best">0</span>
        </div>
      </div>
    </header>
 
    <div class="toolbar">
      <button class="btn" id="undo-btn" type="button">↶ Отменить ход</button>
      <button class="btn" id="restart-btn" type="button">↻ Начать заново</button>
      <button class="btn" id="leaders-btn" type="button">🏆 Лидеры</button>
    </div>
 
    <section class="board-wrap">
      <div class="board" id="board"></div>
            <div class="game-over hidden" id="game-over">
        <p class="game-over__message" id="game-over-message">Игра окончена!</p>
        <p class="game-over__score">Ваш счёт: <span id="final-score">0</span></p>
        <form class="game-over__form" id="save-form">
          <input class="input" id="player-name" type="text" placeholder="Введите имя" maxlength="20" autocomplete="off">
          <button class="btn btn--accent" type="submit">Сохранить результат</button>
        </form>
        <button class="btn" id="over-restart-btn" type="button">↻ Начать заново</button>
      </div>

    </section>
  </main>
</body>
</html>
